name: WaterOut
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant, ja]
settings:
  base:
    APP_ID: com.hgsldswk.waterout
    APP_STORE_ID: "6837715043"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  WaterOut:
    type: application
    platform: iOS
    sources: [WaterOut, Shared]
    dependencies:
      - target: WaterOutWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: WaterOut AppStore
    entitlements:
      path: WaterOut/WaterOut.entitlements
      properties: {}
    info:
      path: WaterOut/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Water Eject
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "Only used to route the earpiece test tone to the earpiece. Nothing is recorded."
        APP_STORE_ID: "$(APP_STORE_ID)"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.waterout.preset
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [wateroutpreset]
        CFBundleDocumentTypes:
          - CFBundleTypeName: WaterOut Preset
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.waterout.preset]
  WaterOutWidget:
    type: app-extension
    platform: iOS
    sources: [WaterOutWidget, Shared/L10n.swift, Shared/Localizable.xcstrings, Shared/PlaybackActivity.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: WaterOut Widget AppStore
    entitlements:
      path: WaterOutWidget/WaterOutWidget.entitlements
      properties: {}
    info:
      path: WaterOutWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Water Eject
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  WaterOutTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WaterOutTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  WaterOutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WaterOutUITests]
    dependencies:
      - target: WaterOut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WaterOut
schemes:
  WaterOut:
    build:
      targets:
        WaterOut: all
        WaterOutTests: [test]
    test:
      config: Debug
      targets: [WaterOutTests]
  WaterOutUI:
    build:
      targets:
        WaterOut: all
        WaterOutUITests: [test]
    test:
      config: Debug
      targets: [WaterOutUITests]
